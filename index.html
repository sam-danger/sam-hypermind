<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAM System Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
  <style>
    /* Temel body ve arka plan */
    body {
  background: url("/static/sam_login_ui.png") no-repeat center center fixed;
  background-size: contain; /* resim tamamen ekrana sığacak */
  background-repeat: no-repeat;
  background-position: center center;
}

    @media (max-width: 768px) {
  body {
    background-size: contain; /* mobilde ekrana sığdır */
    background-position: center top;
  }
}


    /* ⚙️ Ayarlar Butonu */
    .settings-button {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #111;
      color: cyan;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 10010;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    .settings-button:hover { background-color: #222; }

    /* ⚙️ Sağdan kayan Ayarlar Paneli */
    .settings-panel {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      color: white;
      padding: 20px;
      box-shadow: -2px 0 12px rgba(0,255,255,0.3);
      border-left: 1px solid rgba(0,255,255,0.08);
      transition: right 0.4s ease-in-out;
      z-index: 10005;
      overflow-y: auto;
    }
    .settings-panel.open { right: 0; }

    .settings-panel ul { list-style: none; padding: 0; margin: 10px 0 0 0; }
    .settings-panel ul li { margin-bottom: 12px; }
    .settings-panel ul li a {
      color: cyan;
      text-decoration: none;
      transition: 0.3s;
    }
    .settings-panel ul li a:hover {
      color: #0ff;
      text-shadow: 0 0 6px rgba(0,255,255,0.5);
    }

    /* Admin Linki */
    .admin-link {
      position: fixed;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(0,224,255,0.6);
      text-shadow: 0 0 4px rgba(0,217,255,0.3);
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.5px;
      z-index: 10007;
      transition: 0.3s ease;
    }
    .admin-link:hover {
      text-shadow: 0 0 6px rgba(0,255,229,0.5);
      color: rgba(0,255,255,0.8);
    }

    /* Overlay ve tıklanabilir alanlar */
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      width: 20%;
      height: 20%;
    }
    .clickable-area { cursor: pointer; background-color: rgba(0,255,0,0.15); z-index: 10000; }

    /* Mikrofon */
    .microphone-click {
      position: absolute;
      bottom: 5%;
      right: 5%;
      width: 8%;
      height: auto;
      max-width: 100px;
      z-index: 10000;
    }

    /* Kamera */
    .camera-click {
      position: absolute;
      top: 43%;
      left: 11%;
      transform: translateX(-50%);
      width: 10%;
      max-width: 140px;
      height: auto;
      cursor: pointer;
      z-index: 10000;
    }

    /* Shadow ve Blockchain */
    .shadow-clickable, .Blockchain-clickable {
      position: fixed;
      cursor: pointer;
      background-color: rgba(255,0,0,0);
      z-index: 10000;
    }
    .shadow-clickable { top: 13vh; left: 70vw; width: 7vw; height: 15vh; }
    .Blockchain-clickable { top: 39vh; left: 83vw; width: 8vw; height: 12vh; }

    /* Mobil ve tablet ayarları */
    @media (max-width: 768px) {
      .settings-panel { width: 85%; right: -85%; }
      .overlay { width: 50%; height: 25%; top: 45%; left: 50%; transform: translate(-50%, -50%); }
      .microphone-click { width: 12%; max-width: 60px; bottom: 5%; right: 5%; }
      .camera-click { width: 18%; max-width: 100px; top: 40%; left: 20%; }
      .shadow-clickable, .Blockchain-clickable { display: none; }
    }
  </style>
</head>
<body>

  <!-- ⚙️ Ayarlar Butonu -->
  <div class="settings-button" onclick="toggleSettingsPanel()" title="Ayarlar">
    <i class="fas fa-cog"></i>
  </div>

  <!-- ⚙️ Ayarlar Paneli -->
  <div id="settingsPanel" class="settings-panel">
    <h2>Ayarlar</h2>
    <ul>
      <li><a href="/profil">Profil Bilgilerim</a></li>
      <li><a href="/security">Güvenlik</a></li>
      <li><a href="/connections">Bağlantılar</a></li>
      <li><a href="/data">Veri İşlemleri</a></li>
      <li><a href="/notes">Notlarım / Randevu</a></li>
      <li><a href="/oturum">Hesap ve Oturum</a></li>
      <li><a href="/feedback" target="_parent">📬 Destek ve Geri Bildirim</a></li>
      <li><a href="/canli-destek" target="_parent">💬 Canlı Destek</a></li>
      <li><a href="#" onclick="logoutUser()">Çıkış Yap</a></li>
    </ul>
  </div>

  <!-- Admin Linki -->
  <a href="/admin-login" class="admin-link">
    <img src="/static/admin_icon.png" alt="Admin Icon" class="admin-icon">
    SAM Neural Operations Interface
  </a>

  <!-- Overlay ve Tıklanabilir Alanlar -->
  <div id="index-overlay" class="overlay">
    <div class="clickable-area" onclick="window.location.href='/chat'" title="DIGITAL TWIN"></div>
  </div>
  <div class="clickable-area microphone-click" onclick="window.location.href='/microphone'" title="Microphone"></div>
  <div class="clickable-area camera-click" onclick="window.location.href='/camera'" title="Camera"></div>
  <div class="shadow-clickable" onclick="window.location.href='/shadow-mode'"></div>
  <div class="Blockchain-clickable" onclick="window.location.href='/blockchain-security'"></div>

  <script>
    const settingsButton = document.querySelector('.settings-button');
    const settingsPanel = document.getElementById('settingsPanel');

    function toggleSettingsPanel() {
      settingsPanel.classList.toggle('open');
    }

    // Panel dışında tıklayınca panel kapanması
    document.addEventListener('click', function(e) {
      if (!settingsPanel.contains(e.target) && !settingsButton.contains(e.target)) {
        settingsPanel.classList.remove('open');
      }
    });

    function logoutUser() {
      fetch("/logout", { method: "POST", headers: { "Content-Type": "application/json" } })
        .then(res => res.json())
        .then(data => { if (data.redirect) window.location.href = data.redirect; });
    }
  </script>

</body>
</html>
