<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAM System Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
 <style>
/* 🖤 Genel Body ve Arka Plan */
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: #111;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;

  /* PC Arka Plan */
  background-image: url('/static/sam_login_ui.png');
  background-size: cover;           /* PC tam ekran */
  background-position: center;      /* Ortalar */
  background-repeat: no-repeat;     
}

/* 🔹 Mobil için arka plan ayarları */
@media (max-width: 480px) {
  body {
    background-size: 60% auto;       /* Mobilde genişlik %60, yükseklik otomatik */
    background-position: top center; /* Üstte ortala */
    background-repeat: no-repeat;    
  }
}


/* ⚙️ Ayarlar Butonu */
.settings-button {
  position: fixed;
  top: 2vh;
  right: 2vw;
  background-color: #111;
  color: cyan;
  padding: 1vh 2vw;
  border-radius: 6px;
  cursor: pointer;
  z-index: 10000;
  font-weight: bold;
  font-size: 1rem;
  transition: background-color 0.3s;
}
.settings-button:hover { background-color: #222; }

/* ⚙️ Sağdan Kayan Ayarlar Paneli */
.settings-panel {
  position: fixed;
  top: 0;
  right: -90vw;
  width: 80vw;
  max-width: 320px;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: white;
  padding: 3vh 3vw;
  box-shadow: -2px 0 6px rgba(0, 255, 255, 0.2);
  border-left: 1px solid rgba(0, 255, 255, 0.08);
  transition: right 0.4s ease-in-out;
  z-index: 9999;
}
.settings-panel.open { right: 0; }
.settings-panel h2 { margin-top: 0; font-size: 2vh; border-bottom: 1px solid #444; padding-bottom: 1vh; }
.settings-panel ul { list-style: none; padding: 0; margin-top: 2vh; }
.settings-panel li { margin: 1.5vh 0; }
.settings-panel a { color: #00e0ff; text-decoration: none; font-weight: bold; font-size: 1.8vh; }
.settings-panel a:hover { text-decoration: underline; }

/* Admin Giriş Linki */
.admin-link {
  position: absolute;
  top: 1vh;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.2vh;
  color: rgba(0, 224, 255, 0.6);
  text-shadow: 0 0 4px rgba(0, 217, 255, 0.3);
  text-decoration: none;
  font-weight: 500;
  letter-spacing: 0.5px;
  z-index: 1000;
  transition: 0.3s ease;
}
.admin-link:hover {
  text-shadow: 0 0 6px rgba(0, 255, 229, 0.5);
  color: rgba(0, 255, 255, 0.8);
}
.admin-link img { width: 1.5vh; height: auto; vertical-align: middle; margin-right: 0.5vh; }

/* Overlay ve Tıklanabilir Alanlar */
.overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.clickable-area { cursor: pointer; }

/* Mikrofon */
#microphone-overlay {
  position: absolute;
  bottom: 5vh;
  right: 5vw;
  width: 15vw;
  height: 15vw;
  max-width: 100px;
  max-height: 100px;
  cursor: pointer;
  z-index: 9999;
}

/* Kamera Tıklama Alanı */
.camera-click {
  position: absolute;
  top: 40%;
  left: 10%;
  transform: translateX(-50%);
  width: 25vw;
  height: 5vh;
  max-width: 140px;
  max-height: 25px;
  cursor: pointer;
  z-index: 9999;
  background-color: rgba(255, 0, 0, 0);
}

/* Shadow ve Blockchain Alanları */
.shadow-clickable, .Blockchain-clickable {
  position: fixed;
  cursor: pointer;
  background-color: rgba(255, 0, 0, 0);
  z-index: 9999;
}
.shadow-clickable { top: 13vh; left: 70vw; width: 7vw; height: 15vh; }
.Blockchain-clickable { top: 39vh; left: 83vw; width: 8vw; height: 12vh; }

/* 🔹 Mobil için arka plan ve panel ayarları */
  body { font-size: 0.85rem; }
  .settings-panel { width: 90vw; right: -95vw; padding: 3vh 5vw; }
  .settings-panel h2 { font-size: 2.2vh; }
  .settings-panel a { font-size: 2vh; }
  .admin-link { font-size: 1.5vh; }
  #microphone-overlay { width: 18vw; height: 18vw; }
  .camera-click { width: 30vw; height: 6vh; }
}
</style>

</head>
<body>

  <!-- ⚙️ Ayarlar Butonu -->
  <div class="settings-button" onclick="toggleSettingsPanel()" title="Ayarlar">
    <i class="fas fa-cog"></i>
  </div>

  <!-- ⚙️ Ayarlar Paneli -->
  <div id="settingsPanel" class="settings-panel">
    <h2>Ayarlar</h2>
    <ul>
      <li><a href="/profil">Profil Bilgilerim</a></li>
      <li><a href="/security">Güvenlik</a></li>
      <li><a href="/connections">Bağlantılar</a></li>
      <li><a href="/data">Veri İşlemleri</a></li>
      <li><a href="/notes">Notlarım / Randevu</a></li>
      <li><a href="/oturum">Hesap ve Oturum</a></li>
      <li><a href="/feedback" target="_parent">📬 Destek ve Geri Bildirim</a></li>
      <li><a href="/canli-destek" target="_parent">💬 Canlı Destek</a></li>
      <li><a href="#" onclick="logoutUser()">Çıkış Yap</a></li>
    </ul>
  </div>

  <!-- Admin Linki -->
  <a href="/admin-login" class="admin-link">
    <img src="/static/admin_icon.png" alt="Admin Icon" class="admin-icon">
    SAM Neural Operations Interface
  </a>

  <!-- Overlay ve Tıklanabilir Alanlar -->
  <div id="index-overlay" class="overlay">
    <div class="clickable-area" onclick="window.location.href='/chat'" title="DIGITAL TWIN"></div>
  </div>
  <div class="clickable-area microphone-click" onclick="window.location.href='/microphone'" title="Microphone"></div>
  <div class="clickable-area camera-click" onclick="window.location.href='/camera'" title="Camera"></div>
  <div class="shadow-clickable" onclick="window.location.href='/shadow-mode'"></div>
  <div class="Blockchain-clickable" onclick="window.location.href='/blockchain-security'"></div>

  <!-- 🍪 Çerez Onayı -->
  <div id="cookieConsent" style="position:fixed; bottom:20px; left:20px; right:20px; background:#222; color:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px #00ffff; z-index:9999; display:none;">
    <p style="margin:0; font-size:14px;"> 🍪 Bu site, deneyiminizi iyileştirmek için çerez kullanır.
      <a href="/cerez-politikasi" style="color:#00ffff; text-decoration:underline;">Detaylı bilgi</a>
    </p>
    <button onclick="acceptCookies()" style="margin-top:10px; padding:6px 14px; background:#00ffff; color:#000; border:none; border-radius:4px; cursor:pointer;">Kabul Ediyorum</button>
  </div>

  <script>
    // Çerez Fonksiyonları
    function setCookie(name, value, days) {
      const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
      document.cookie = name + "=" + value + "; expires=" + expires + "; path=/";
    }
    function getCookie(name) {
      const value = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
      return value ? value.pop() : "";
    }
    function acceptCookies() {
      setCookie("cookieAccepted", "true", 365);
      setCookie("cookieAcceptedDate", new Date().toISOString(), 365);
      document.getElementById("cookieConsent").style.display = "none";
    }
    window.onload = function () {
      if (getCookie("cookieAccepted") !== "true") {
        document.getElementById("cookieConsent").style.display = "block";
      }
    }

    // Ayarlar Paneli Aç/Kapat
    function toggleSettingsPanel() {
      const panel = document.getElementById("settingsPanel");
      panel.classList.toggle("open");
    }

    // Çıkış Fonksiyonu
    function logoutUser() {
      fetch("/logout", { method: "POST", headers: { "Content-Type": "application/json" } })
        .then(res => res.json())
        .then(data => {
          if (data.redirect) { window.location.href = data.redirect; }
        });
    }

    // SAM Güvenlik Overlay (İnaktivite)
    let samTimeout, samOverlay;
    function createSecurityOverlay() {
      samOverlay = document.createElement("div");
      samOverlay.id = "samOverlay";
      samOverlay.style.position = "fixed";
      samOverlay.style.top = 0;
      samOverlay.style.left = 0;
      samOverlay.style.width = "100%";
      samOverlay.style.height = "100%";
      samOverlay.style.background = "rgba(0, 0, 0, 0.9)";
      samOverlay.style.backdropFilter = "blur(10px)";
      samOverlay.style.display = "flex";
      samOverlay.style.alignItems = "center";
      samOverlay.style.justifyContent = "center";
      samOverlay.style.zIndex = 999999;
      samOverlay.innerHTML = `<div style="color:#00ffff; font-size:20px; text-align:center;">
        🔒 SAM Güvenlik Modu <br><br>
        Uzun süreli hareketsizlik algılandı.<br>
        Sistemi devam ettirmek için ekrana dokunun...
      </div>`;
      document.body.appendChild(samOverlay);
    }
    function removeSecurityOverlay() {
      if (samOverlay) { samOverlay.remove(); samOverlay = null; }
    }
    function resetSamInactivityTimer() {
      clearTimeout(samTimeout);
      samTimeout = setTimeout(createSecurityOverlay, 120000); // 2 dakika
    }
    ["click", "mousemove", "keydown", "touchstart"].forEach(evt => {
      document.addEventListener(evt, () => {
        removeSecurityOverlay();
        resetSamInactivityTimer();
      });
    });
    window.addEventListener("load", resetSamInactivityTimer);
  </script>
</body>
</html>
