<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAM System Interface</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* 🔷 GENEL GÖRÜNÜM */
    body {
  background: url("/static/sam_login_ui.png") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}


    /* ⚙️ Ayarlar Butonu */
    .settings-button {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      color: cyan;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 10010;
      font-weight: bold;
      transition: 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .settings-button:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    /* ⚙️ Kayan Ayarlar Paneli */
    .settings-panel {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      color: white;
      padding: 20px;
      box-shadow: -2px 0 12px rgba(0, 255, 255, 0.3);
      border-left: 1px solid rgba(0, 255, 255, 0.1);
      transition: right 0.4s ease-in-out;
      z-index: 10050;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .settings-panel.open {
      right: 0;
    }

    .settings-panel ul {
      list-style: none;
      padding: 0;
      margin: 20px 0 0 0;
    }

    .settings-panel ul li {
      margin-bottom: 14px;
    }

    .settings-panel ul li a {
      color: cyan;
      text-decoration: none;
      transition: 0.3s;
    }

    .settings-panel ul li a:hover {
      color: #0ff;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.6);
    }

    /* 👑 Admin Giriş */
    .admin-link {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(0, 224, 255, 0.6);
      text-shadow: 0 0 4px rgba(0, 217, 255, 0.3);
      text-decoration: none;
      font-weight: 500;
      z-index: 10007;
    }

    .admin-link:hover {
      text-shadow: 0 0 6px rgba(0, 255, 229, 0.5);
      color: rgba(0, 255, 255, 0.8);
    }

    /* 🎯 Ana Ekran Ortası */
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      width: 40vw;
      height: 40vh;
    }

    /* 🎤 Mikrofon */
    .microphone-click {
      position: fixed;
      bottom: 50px;
      right: 50px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      cursor: pointer;
      background-color: rgba(0, 255, 255, 0.1);
      transition: background 0.3s;
    }

    .microphone-click:hover {
      background-color: rgba(0, 255, 255, 0.25);
    }

    /* 📷 Kamera */
    .camera-click {
      position: fixed;
      top: 43%;
      left: 15%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 25px;
      cursor: pointer;
      background-color: rgba(0, 255, 255, 0.1);
      transition: background 0.3s;
    }

    .camera-click:hover {
      background-color: rgba(0, 255, 255, 0.25);
    }

    /* 🌑 Shadow ve Blockchain */
    .shadow-clickable,
    .Blockchain-clickable {
      position: fixed;
      cursor: pointer;
      z-index: 10000;
    }

    .shadow-clickable {
      top: 13vh;
      left: 70vw;
      width: 7vw;
      height: 15vh;
    }

    .Blockchain-clickable {
      top: 39vh;
      left: 83vw;
      width: 8vw;
      height: 12vh;
    }

    /* 📱 Mobil Uyumluluk */
    @media (max-width: 768px) {
      .settings-button {
        top: 10px;
        right: 10px;
        padding: 8px 10px;
      }

      .settings-panel {
        width: 80%;
        right: -80%;
      }

      .overlay {
        width: 80vw;
        height: 30vh;
      }

      .microphone-click {
        width: 70px;
        height: 70px;
        bottom: 15px;
        right: 15px;
      }

      .camera-click {
        width: 100px;
        top: 50%;
        left: 20%;
      }

      .shadow-clickable,
      .Blockchain-clickable {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- ⚙️ Ayarlar Butonu -->
  <div class="settings-button" onclick="toggleSettingsPanel()" title="Ayarlar">
    <i class="fas fa-cog"></i>
  </div>

  <!-- ⚙️ Ayarlar Paneli -->
  <div id="settingsPanel" class="settings-panel">
    <h2>Ayarlar</h2>
    <ul>
      <li><a href="/profil">Profil Bilgilerim</a></li>
      <li><a href="/security">Güvenlik</a></li>
      <li><a href="/connections">Bağlantılar</a></li>
      <li><a href="/data">Veri İşlemleri</a></li>
      <li><a href="/notes">Notlarım / Randevu</a></li>
      <li><a href="/oturum">Hesap ve Oturum</a></li>
      <li><a href="/feedback" target="_parent">📬 Destek ve Geri Bildirim</a></li>
      <li><a href="/canli-destek" target="_parent">💬 Canlı Destek</a></li>
      <li><a href="#" onclick="logoutUser()">Çıkış Yap</a></li>
    </ul>
  </div>

  <!-- 🧠 Admin Link -->
  <a href="/admin-login" class="admin-link">
    <img src="/static/admin_icon.png" alt="Admin Icon" class="admin-icon">
    SAM Neural Operations Interface
  </a>

  <!-- 🔷 Tıklanabilir Alanlar -->
  <div id="index-overlay" class="overlay">
    <div class="clickable-area" onclick="window.location.href='/chat'" title="DIGITAL TWIN"></div>
  </div>

  <div class="clickable-area microphone-click" onclick="window.location.href='/microphone'" title="Microphone"></div>
  <div class="clickable-area camera-click" onclick="window.location.href='/camera'" title="Camera"></div>
  <div class="shadow-clickable" onclick="window.location.href='/shadow-mode'"></div>
  <div class="Blockchain-clickable" onclick="window.location.href='/blockchain-security'"></div>

  <script>
    const settingsButton = document.querySelector('.settings-button');
    const settingsPanel = document.getElementById('settingsPanel');

    function toggleSettingsPanel() {
      settingsPanel.classList.toggle('open');
    }

    // Panel dışına tıklanınca kapanması
    document.addEventListener('click', function(e) {
      if (!settingsPanel.contains(e.target) && !settingsButton.contains(e.target)) {
        settingsPanel.classList.remove('open');
      }
    });

    function logoutUser() {
      fetch("/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" }
      })
      .then(res => res.json())
      .then(data => {
        if (data.redirect) window.location.href = data.redirect;
      });
    }
  </script>
</body>
</html>
