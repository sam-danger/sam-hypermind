<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAM System Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
</head>
<body>

  <!-- ⚙️ Ayarlar Butonu -->
  <button class="settings-button" aria-label="Ayarlar" onclick="toggleSettingsPanel()">
    <i class="fas fa-cog"></i>
  </button>

  <!-- ⚙️ Ayarlar Paneli -->
  <nav id="settingsPanel" class="settings-panel" aria-label="Ayarlar Menüsü">
    <h2>Ayarlar</h2>
    <ul>
      <li><a href="/profil">Profil Bilgilerim</a></li>
      <li><a href="/security">Güvenlik</a></li>
      <li><a href="/connections">Bağlantılar</a></li>
      <li><a href="/data">Veri İşlemleri</a></li>
      <li><a href="/notes">Notlarım / Randevu</a></li>
      <li><a href="/oturum">Hesap ve Oturum</a></li>
      <li><a href="/feedback" target="_parent">📬 Destek ve Geri Bildirim</a></li>
      <li><a href="/canli-destek" target="_parent">💬 Canlı Destek</a></li>
      <li><button onclick="logoutUser()">Çıkış Yap</button></li>
    </ul>
  </nav>

  <!-- 🧠 ARKA PLAN + TIKLANABİLİR ALANLAR -->
  <div class="image-container">
    <img src="/static/sam_login_ui.png" alt="SAM Interface" class="background-img" loading="lazy">

    <div class="camera-click" onclick="location.href='/camera'" aria-label="Kamera"></div>
    <div class="shadow-clickable" onclick="location.href='/shadow-mode'" aria-label="Shadow Mode"></div>
    <div class="Blockchain-clickable" onclick="location.href='/blockchain-security'" aria-label="Blockchain Güvenliği"></div>
    <div id="microphone-overlay" onclick="location.href='/microphone'" aria-label="Mikrofon"></div>
  </div>

  <!-- 📱 MOBİL PANEL -->
  <div class="mobile-panel" aria-label="Mobil Menü">
    <button class="mobile-button" onclick="location.href='/chat'">💬 Sohbet</button>
    <button class="mobile-button" onclick="location.href='/microphone'">🎤 Mikrofon</button>
    <button class="mobile-button" onclick="location.href='/camera'">📷 Kamera</button>
    <button class="mobile-button" onclick="location.href='/profil'">👤 Profil</button>
  </div>

  <!-- 👑 ADMIN LİNK -->
  <a href="/admin-login" class="admin-link">
    <img src="/static/admin_icon.png" alt="Admin Icon">
    SAM Neural Operations Interface
  </a>

</body>
</html>
