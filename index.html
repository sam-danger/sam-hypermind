<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM System Interface - Responsive</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  /* ===== Genel Ayarlar ===== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #111;
    color: #fff;
    overflow-x: hidden;
  }

  a { text-decoration: none; color: inherit; }

  /* ===== Ayarlar Butonu ===== */
  .settings-button {
    position: fixed;
    top: 2vh;
    right: 2vw;
    background: #111;
    color: cyan;
    padding: 1vh 2vw;
    border-radius: 8px;
    cursor: pointer;
    z-index: 1000;
    font-size: 3vw;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
  }
  .settings-button:hover { background: #222; }

  /* ===== Ayarlar Paneli ===== */
  .settings-panel {
    position: fixed;
    top: 0;
    right: -80vw;
    width: 75vw;
    max-width: 320px;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 5vw;
    transition: right 0.4s ease-in-out;
    z-index: 999;
  }
  .settings-panel.open { right: 0; }
  .settings-panel h2 {
    font-size: 5vw;
    margin-bottom: 4vh;
    border-bottom: 1px solid #444;
    padding-bottom: 1vh;
  }
  .settings-panel ul { list-style: none; }
  .settings-panel li { margin: 3vh 0; font-size: 4vw; }
  .settings-panel a { color: #0ff; font-weight: bold; }
  .settings-panel a:hover { text-decoration: underline; }

  /* ===== Admin Link ===== */
  .admin-link {
    position: fixed;
    top: 2vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3.5vw;
    color: rgba(0,224,255,0.7);
    text-shadow: 0 0 4px rgba(0,217,255,0.3);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 1vw;
  }

  /* ===== Overlay ve Tıklanabilir Alanlar ===== */
  .clickable-area { cursor: pointer; }
  .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }

  #microphone-overlay {
    position: fixed;
    bottom: 5vh;
    right: 5vw;
    width: 12vw;
    height: 12vw;
    cursor: pointer;
    z-index: 999;
  }
  .camera-click {
    position: fixed;
    top: 40%;
    left: 10%;
    width: 30vw;
    height: 5vh;
    background: rgba(255,0,0,0);
    cursor: pointer;
    z-index: 999;
  }

  .shadow-clickable, .Blockchain-clickable {
    position: fixed;
    cursor: pointer;
    background: rgba(255,0,0,0);
    z-index: 999;
  }
  .shadow-clickable { top: 13vh; left: 70vw; width: 15vw; height: 15vh; }
  .Blockchain-clickable { top: 39vh; left: 82vw; width: 16vw; height: 12vh; }

  /* ===== Çerez Onayı ===== */
  #cookieConsent {
    position: fixed;
    bottom: 3vh;
    left: 3vw;
    right: 3vw;
    background: #222;
    color: #fff;
    padding: 4vw;
    border-radius: 8px;
    box-shadow: 0 0 10px #0ff;
    z-index: 9999;
    display: none;
    font-size: 3.5vw;
  }
  #cookieConsent button {
    margin-top: 2vh;
    padding: 2vw 4vw;
    background: #0ff;
    color: #000;
    border: none;
    border-radius: 4px;
    font-size: 3.5vw;
    cursor: pointer;
  }

  /* ===== Media Queries ===== */
  @media screen and (max-width: 480px) {
    .settings-button { font-size: 4vw; padding: 2vw 3vw; }
    .settings-panel h2 { font-size: 6vw; }
    .settings-panel li { font-size: 5vw; }
    .admin-link { font-size: 4.5vw; }
    .camera-click { width: 35vw; height: 6vh; }
  }
</style>
</head>

<body>

<!-- ⚙️ Ayarlar Butonu -->
<div class="settings-button" onclick="toggleSettingsPanel()">
  <i class="fas fa-cog"></i>
</div>

<!-- ⚙️ Ayarlar Paneli -->
<div id="settingsPanel" class="settings-panel">
  <h2>Ayarlar</h2>
  <ul>
    <li><a href="/profil">Profil Bilgilerim</a></li>
    <li><a href="/security">Güvenlik</a></li>
    <li><a href="/connections">Bağlantılar</a></li>
    <li><a href="/data">Veri İşlemleri</a></li>
    <li><a href="/notes">Notlarım / Randevu</a></li>
    <li><a href="/oturum">Hesap ve Oturum</a></li>
    <li><a href="/feedback" target="_parent">📬 Destek ve Geri Bildirim</a></li>
    <li><a href="/canli-destek" target="_parent">💬 Canlı Destek</a></li>
    <li><a href="#" onclick="logoutUser()">Çıkış Yap</a></li>
  </ul>
</div>

<!-- Admin Link -->
<a href="/admin-login" class="admin-link">
  <img src="/static/admin_icon.png" alt="Admin Icon" style="height:3vw;">
  SAM Neural Operations Interface
</a>

<!-- Overlay ve tıklanabilir alanlar -->
<div class="overlay clickable-area" onclick="window.location.href='/chat'"></div>
<div id="microphone-overlay" onclick="window.location.href='/microphone'"></div>
<div class="camera-click" onclick="window.location.href='/camera'"></div>
<div class="shadow-clickable" onclick="window.location.href='/shadow-mode'"></div>
<div class="Blockchain-clickable" onclick="window.location.href='/blockchain-security'"></div>

<!-- Çerez Onayı -->
<div id="cookieConsent">
  🍪 Bu site deneyiminizi iyileştirmek için çerez kullanır.
  <a href="/cerez-politikasi" style="color:#0ff; text-decoration:underline;">Detaylı bilgi</a>
  <button onclick="acceptCookies()">Kabul Ediyorum</button>
</div>

<script>
  // Çerez
  function setCookie(name,value,days){ const d = new Date(); d.setTime(d.getTime()+days*24*60*60*1000); document.cookie = name+"="+value+";path=/;expires="+d.toUTCString(); }
  function getCookie(name){ const c = document.cookie.match("(^|;)\\s*"+name+"\\s*=\\s*([^;]+)"); return c ? c.pop() : ""; }
  function acceptCookies(){ setCookie("cookieAccepted","true",365); document.getElementById("cookieConsent").style.display="none"; }
  window.onload = () => { if(getCookie("cookieAccepted")!=="true") document.getElementById("cookieConsent").style.display="block"; }

  // Ayarlar Paneli
  function toggleSettingsPanel(){ document.getElementById("settingsPanel").classList.toggle("open"); }

  // Logout
  function logoutUser(){ fetch("/logout",{method:"POST",headers:{"Content-Type":"application/json"}}).then(r=>r.json()).then(d=>{ if(d.redirect) window.location.href=d.redirect; }); }
</script>

</body>
</html>
