<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAM System Interface</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Harici Stil -->
  <link rel="stylesheet" href="/static/style.css">

  <style>
    /* 🖤 Genel Body Ayarları */
    body {
  margin: 0;
  padding: 0;
  background-image: url('static/sam_login_ui.png'); /* static klasöründen */
  background-size: cover;
  background-position: center;
  font-family: 'Segoe UI', Arial, sans-serif;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ⚙️ Ayarlar Butonu */
.settings-button {
  position: fixed;
  top: 15px;
  right: 15px;
  background-color: transparent;
  padding: 8px;
  border: none;
  cursor: pointer;
  z-index: 10000;
}
.settings-button i {
  font-size: 20px;
  color: #cccccc;
  transition: transform 0.3s ease;
}
.settings-button:hover i {
  transform: rotate(20deg);
}

/* ⚙️ Sağdan Kayan Ayarlar Paneli */
.settings-panel {
  position: fixed;
  top: 0;
  right: -280px;
  width: 260px;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(10px);
  color: white;
  padding: 15px;
  box-shadow: -2px 0 6px rgba(0, 255, 255, 0.2);
  border-left: 1px solid rgba(0, 255, 255, 0.08);
  transition: right 0.4s ease-in-out;
  z-index: 9999;
}
.settings-panel.open { right: 0; }
.settings-panel h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 8px; }
.settings-panel ul { list-style: none; padding: 0; margin-top: 15px; }
.settings-panel li { margin: 10px 0; }
.settings-panel a { color: #00e0ff; text-decoration: none; font-weight: bold; font-size: 14px; }
.settings-panel a:hover { text-decoration: underline; }

/* Admin Linki */
.admin-link {
  position: absolute;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(0, 224, 255, 0.6);
  text-decoration: none;
  font-weight: 500;
  letter-spacing: 0.5px;
  z-index: 1000;
}
.admin-link img { width: 14px; height: auto; margin-right: 4px; vertical-align: middle; }
.admin-link:hover { color: rgba(0, 255, 255, 0.8); }

/* Overlay ve Tıklanabilir Alanlar */
.overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.clickable-area { cursor: pointer; }

/* Mikrofon */
#microphone-overlay {
  position: absolute;
  bottom: 30px;
  right: 30px;
  width: 70px;
  height: 70px;
  cursor: pointer;
  z-index: 9999;
}

/* Kamera Tıklama Alanı */
.camera-click {
  position: absolute;
  top: 40%;
  left: 10%;
  transform: translateX(-50%);
  width: 120px;
  height: 20px;
  cursor: pointer;
  z-index: 9999;
  background-color: rgba(255, 0, 0, 0);
}

/* Shadow ve Blockchain Alanları */
.shadow-clickable, .Blockchain-clickable {
  position: fixed;
  cursor: pointer;
  background-color: rgba(255, 0, 0, 0);
  z-index: 9999;
}
.shadow-clickable { top: 12vh; left: 65vw; width: 6vw; height: 12vh; }
.Blockchain-clickable { top: 38vh; left: 80vw; width: 7vw; height: 10vh; }

/* Çerez Uyarısı */
#cookieConsent {
  position: fixed;
  bottom: 15px;
  left: 10px;
  right: 10px;
  background: #222;
  color: #fff;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 0 8px #00ffff;
  z-index: 9999;
  display: none;
}
#cookieConsent a { color: #00ffff; text-decoration: underline; font-size: 13px; }
#cookieConsent button { margin-top: 8px; padding: 6px 12px; background:#00ffff; color:#000; border:none; border-radius:4px; cursor:pointer; font-size: 13px; }

/* 📱 Responsive Mobil Düzenlemeleri */
@media only screen and (max-width: 480px) {
  .settings-panel { width: 220px; padding: 10px; right: -240px; }
  .settings-panel h2 { font-size: 16px; }
  .settings-panel a { font-size: 13px; }
  .admin-link { font-size: 11px; }
  #microphone-overlay { width: 60px; height: 60px; bottom: 20px; right: 20px; }
  .camera-click { width: 100px; height: 18px; top: 38%; left: 12%; }
  .shadow-clickable { width: 5vw; height: 10vh; top: 10vh; left: 60vw; }
  .Blockchain-clickable { width: 6vw; height: 8vh; top: 35vh; left: 75vw; }
  #cookieConsent { padding: 12px; font-size: 12px; bottom: 10px; left: 5px; right: 5px; }
}
  </style>
</head>
<body>

<!-- Sesli komut için görünmez yönlendirme bağlantıları -->
<div style="display: none;">

  <a href="/data" id="goto-veri"></a>
  <a href="/profil" id="goto-profil"></a>

</div>


  <!-- ⚙️ Ayarlar Butonu -->

  <i class="fas fa-cog"></i>
</div>

  <!-- ⚙️ Sağdan kayan Ayarlar Paneli -->
  <div id="settingsPanel" class="settings-panel">
    
    <h2>Ayarlar</h2>
<ul>
  <li><a href="/profil">Profil Bilgilerim</a></li>

<!-- Ayarlar Paneli kapanışı -->
</div>

<!-- Çıkış fonksiyonu -->
<script>
  function logoutUser() {

      headers: { "Content-Type": "application/json" }
    })
    .then(res => res.json())

      if (data.redirect) {
        window.location.href = data.redirect;
      }
    });
  }
</script>


  <!-- Admin Giriş Linki -->
  <a href="/admin-login" class="admin-link">
    <img src="/static/admin_icon.png" alt="Admin Icon" class="admin-icon">
    SAM Neural Operations Interface
  </a>

  <!-- SADECE index.html'de -->
<!-- DIGITAL TWIN -->
<div id="index-overlay" class="overlay">
    <div class="clickable-area" onclick="window.location.href='/chat'" title="DIGITAL TWIN"></div>
</div>


<div class="clickable-area microphone-click" onclick="window.location.href='/microphone'" title="Microphone"></div>


<!-- 🎤 Mikrofon Alanı (Tıklanabilir) -->


<!-- 🍪 Çerez Onayı Kutusu -->
<div id="cookieConsent" style="position:fixed; bottom:20px; left:20px; right:20px; background:#222; color:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px #00ffff; z-index:9999; display:none;">
  <p style="margin:0; font-size:14px;">
    🍪 Bu site, deneyiminizi iyileştirmek için çerez kullanır.
    <a href="/cerez-politikasi" style="color:#00ffff; text-decoration:underline;">Detaylı bilgi</a>
  </p>
  <button onclick="acceptCookies()" style="margin-top:10px; padding:6px 14px; background:#00ffff; color:#000; border:none; border-radius:4px; cursor:pointer;">
    Kabul Ediyorum
  </button>
</div>


<script>
  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
    document.cookie = name + "=" + value + "; expires=" + expires + "; path=/";
  }

  function getCookie(name) {
    const value = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return value ? value.pop() : "";
  }

  function acceptCookies() {
    setCookie("cookieAccepted", "true", 365);
    setCookie("cookieAcceptedDate", new Date().toISOString(), 365);
    document.getElementById("cookieConsent").style.display = "none";
  }

  window.onload = function () {
    if (getCookie("cookieAccepted") !== "true") {
      document.getElementById("cookieConsent").style.display = "block";
    }
  };
</script>





  <!-- Panel Aç/Kapat Script -->
  <script>
    function toggleSettingsPanel() {
      const panel = document.getElementById("settingsPanel");
      panel.classList.toggle("open");
    }
  </script>

<script>
    if (window.location.pathname === "/" || window.location.pathname === "/index") {
        const overlay = document.createElement("div");
        overlay.className = "overlay";

        const clickable = document.createElement("div");
        clickable.className = "clickable-area";
        clickable.title = "DIGITAL TWIN";
        clickable.onclick = () => window.location.href = "/chat";

        overlay.appendChild(clickable);
        document.body.appendChild(overlay);
    }
</script>

<script>
    // Eğer sayfa index değilse, overlay’i kaldır
    if (window.location.pathname !== "/" && window.location.pathname !== "/index") {
        const overlay = document.getElementById("index-overlay");
        if (overlay) overlay.remove();
    }
</script>

<script>
let samTimeout;
let samOverlay;

function createSecurityOverlay() {
    samOverlay = document.createElement("div");
    samOverlay.id = "samOverlay";
    samOverlay.style.position = "fixed";
    samOverlay.style.top = 0;
    samOverlay.style.left = 0;
    samOverlay.style.width = "100%";
    samOverlay.style.height = "100%";
    samOverlay.style.background = "rgba(0, 0, 0, 0.9)";
    samOverlay.style.backdropFilter = "blur(10px)";
    samOverlay.style.display = "flex";
    samOverlay.style.alignItems = "center";
    samOverlay.style.justifyContent = "center";
    samOverlay.style.zIndex = 999999;
    samOverlay.innerHTML = `<div style="color:#00ffff; font-size:20px; text-align:center;">
        🔒 SAM Güvenlik Modu <br><br>
        Uzun süreli hareketsizlik algılandı.<br>
        Sistemi devam ettirmek için ekrana dokunun...
    </div>`;
    document.body.appendChild(samOverlay);
}

function removeSecurityOverlay() {
    if (samOverlay) {
        samOverlay.remove();
        samOverlay = null;
    }
}

function resetSamInactivityTimer() {
    clearTimeout(samTimeout);
    samTimeout = setTimeout(() => {
        createSecurityOverlay();
    }, 120000); // 2 dakika (120000 ms)
}

// Her etkileşimde sıfırla
["click", "mousemove", "keydown", "touchstart"].forEach(evt => {
    document.addEventListener(evt, () => {
        removeSecurityOverlay();
        resetSamInactivityTimer();
    });
});

window.addEventListener("load", resetSamInactivityTimer);
</script>




</body>
