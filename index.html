<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>SAM System Interface</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-VvQ3xK+8jv0K6x2T8W+g6nQv1a4JcT9Dk1y3lK2l2vOkZ1e+6+Jx9+Pd8tO3L+QYv9+YQpO1/xvF4UGM6Z5p0A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Ana Stil -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* ⚙️ Ayarlar Butonu */
    .settings-button {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background-color: #111;
      color: cyan;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      z-index: 10010;
      font-weight: bold;
      transition: background-color 0.3s;
      font-size: 1rem;
    }
    .settings-button:hover { background-color: #222; }

    /* ⚙️ Sağdan kayan Ayarlar Paneli */
    .settings-panel {
      position: fixed;
      top: 0;
      right: -20vw;
      width: 18vw;
      min-width: 280px;
      max-width: 320px;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      color: white;
      padding: 1.25rem;
      box-shadow: -2px 0 1rem rgba(0, 255, 255, 0.3);
      border-left: 1px solid rgba(0, 255, 255, 0.08);
      transition: right 0.4s ease-in-out;
      z-index: 10005;
      overflow-y: auto;
      font-size: 1rem;
    }
    .settings-panel.open { right: 0; }

    .settings-panel ul {
      list-style: none;
      padding: 0;
      margin: 1rem 0 0 0;
    }
    .settings-panel ul li {
      margin-bottom: 0.75rem;
    }
    .settings-panel ul li a {
      color: cyan;
      text-decoration: none;
      transition: 0.3s;
    }
    .settings-panel ul li a:hover {
      color: #0ff;
      text-shadow: 0 0 0.5rem rgba(0,255,255,0.5);
    }

    /* Admin Giriş Linki */
    .admin-link {
      position: fixed;
      top: 0.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      color: rgba(0, 224, 255, 0.6);
      text-shadow: 0 0 0.25rem rgba(0, 217, 255, 0.3);
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.5px;
      z-index: 10007;
      transition: 0.3s ease;
    }
    .admin-link:hover {
      text-shadow: 0 0 0.5rem rgba(0, 255, 229, 0.5);
      color: rgba(0, 255, 255, 0.8);
    }

    /* Overlay ve Tıklanabilir Alanlar */
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 400px;
      height: 40%;
      max-height: 350px;
      z-index: 10000;
    }
    .clickable-area {
      cursor: pointer;
      background-color: rgba(0,255,0,0.15);
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Mikrofon */
    .microphone-click {
      position: fixed;
      bottom: 3rem;
      right: 3rem;
      width: 6rem;
      height: 6rem;
      z-index: 10000;
    }

    /* Kamera */
    .camera-click {
      position: fixed;
      top: 43%;
      left: 11%;
      transform: translateX(-50%);
      width: 8.5rem;
      height: 2rem;
      cursor: pointer;
      z-index: 10000;
    }

    /* Shadow ve Blockchain */
    .shadow-clickable, .Blockchain-clickable {
      position: fixed;
      cursor: pointer;
      background-color: rgba(255, 0, 0, 0);
      z-index: 10000;
    }
    .shadow-clickable { top: 13vh; left: 70vw; width: 7vw; height: 15vh; }
    .Blockchain-clickable { top: 39vh; left: 83vw; width: 8vw; height: 12vh; }

    /* Mobil ve tablet uyumlu tasarım */
    @media (max-width: 1024px) {
      .settings-panel { width: 85%; right: -85%; font-size: 0.9rem; }
      .microphone-click { width: 4rem; height: 4rem; bottom: 1.5rem; right: 1.5rem; }
      .camera-click { width: 6rem; top: 40%; left: 20%; }
      .shadow-clickable, .Blockchain-clickable { display: none; }
      .overlay { width: 80%; height: 35%; }
    }
   @media (max-width: 480px) {
  .settings-panel {
    width: 100%;        /* Artık tamamen ekran genişliğini kapsar */
    right: -100%;       /* Panelin kapanma pozisyonu */
    font-size: 0.8rem;  /* Daha küçük yazılar */
    padding: 1rem;      /* İç boşlukları mobil uyumlu */
  }
  .settings-panel.open { right: 0; }
}
@media (max-width: 480px) {
  .settings-panel ul li {
    margin-bottom: 0.5rem; /* Daha sıkışık */
  }
  .settings-panel ul li a {
    font-size: 0.9rem;
    display: block;        /* Link tüm satırı kaplar */
    padding: 0.4rem 0;
  }
}
@media (max-width: 480px) {
  .settings-panel {
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    right: 0;
    border-left: none;
    border-radius: 0;
    box-shadow: none;
  }
}

  </style>
</head>
<body>

  <!-- ⚙️ Ayarlar Butonu -->
  <div class="settings-button" onclick="toggleSettingsPanel()" title="Ayarlar">
    <i class="fas fa-cog"></i>
  </div>

  <!-- ⚙️ Ayarlar Paneli -->
  <div id="settingsPanel" class="settings-panel">
    <h2>Ayarlar</h2>
    <ul>
      <li><a href="/profil">Profil Bilgilerim</a></li>
      <li><a href="/security">Güvenlik</a></li>
      <li><a href="/connections">Bağlantılar</a></li>
      <li><a href="/data">Veri İşlemleri</a></li>
      <li><a href="/notes">Notlarım / Randevu</a></li>
      <li><a href="/oturum">Hesap ve Oturum</a></li>
      <li><a href="/feedback" target="_parent">📬 Destek ve Geri Bildirim</a></li>
      <li><a href="/canli-destek" target="_parent">💬 Canlı Destek</a></li>
      <li><a href="#" onclick="logoutUser()">Çıkış Yap</a></li>
    </ul>
  </div>

  <!-- Admin Linki -->
  <a href="/admin-login" class="admin-link">
    <img src="{{ url_for('static', filename='admin_icon.png') }}" alt="Admin Icon" class="admin-icon">
    SAM Neural Operations Interface
  </a>

  <!-- Overlay ve Tıklanabilir Alanlar -->
  <div id="index-overlay" class="overlay">
    <div class="clickable-area" onclick="window.location.href='/chat'" title="DIGITAL TWIN"></div>
  </div>
  <div class="clickable-area microphone-click" onclick="window.location.href='/microphone'" title="Microphone"></div>
  <div class="clickable-area camera-click" onclick="window.location.href='/camera'" title="Camera"></div>
  <div class="shadow-clickable" onclick="window.location.href='/shadow-mode'"></div>
  <div class="Blockchain-clickable" onclick="window.location.href='/blockchain-security'"></div>

  <script>
    const settingsButton = document.querySelector('.settings-button');
    const settingsPanel = document.getElementById('settingsPanel');

    function toggleSettingsPanel() {
      settingsPanel.classList.toggle('open');
    }

    // Panel dışında tıklayınca panel kapanması
    document.addEventListener('click', function(e) {
      if (!settingsPanel.contains(e.target) && !settingsButton.contains(e.target)) {
        settingsPanel.classList.remove('open');
      }
    });

    function logoutUser() {
      fetch("/logout", { method: "POST", headers: { "Content-Type": "application/json" } })
        .then(res => res.json())
        .then(data => { if (data.redirect) window.location.href = data.redirect; });
    }
  </script>

</body>
</html>
