<!DOCTYPE html>

<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Ayarları -->

  <title>{{ seo.title }}</title>
  <meta name="description" content="{{ seo.description }}">
  <meta name="keywords" content="{{ seo.keywords }}">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->

  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:type" content="{{ seo.type }}">
  <meta property="og:url" content="{{ seo.url }}">
  <meta property="og:image" content="{{ seo.logo }}">

  <!-- Twitter Card -->

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ seo.title }}">
  <meta name="twitter:description" content="{{ seo.description }}">
  <meta name="twitter:image" content="{{ seo.logo }}">

  <!-- JSON-LD Structured Data -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{{ seo.type }}",
    "name": "{{ seo.title }}",
    "url": "{{ seo.url }}",
    "description": "{{ seo.description }}",
    "publisher": {
      "@type": "Organization",
      "name": "SAM HyperMind",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ seo.logo }}"
      }
    }
  }
  </script>

  <!-- Google Fonts & FontAwesome -->

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { margin:0; padding:0; font-family:'Poppins',sans-serif; box-sizing:border-box; }
    body {
      height:100vh;
      background:url('/static/sam_login_bg.jpg') no-repeat center center fixed;
      background-size:cover;
      display:flex; justify-content:center; align-items:center;
      backdrop-filter:blur(5px); padding:20px;
    }
    .login-container {
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:16px; padding:40px 30px;
      width:100%; max-width:400px;
      color:#fff; box-shadow:0 0 20px rgba(0,255,255,0.1);
    }
    .login-container h2 {
      font-size:26px; text-align:center;
      background:linear-gradient(90deg,#111,#000);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .login-container h2 i { color:#b8860b; font-size:22px; margin-right:10px; }
    .login-container input {
      width:100%; padding:12px; margin-bottom:20px;
      border:none; border-radius:8px;
      background:rgba(255,255,255,0.1); color:#fff; font-size:14px;
    }
    .login-container input::placeholder { color:#ccc; }
    .login-container button {
      width:100%; padding:12px;
      background-color:#00ffff; color:#000;
      font-weight:bold; border:none; border-radius:8px;
      cursor:pointer; font-size:16px; transition:0.3s;
    }
    .login-container button:hover { background-color:#00dddd; }
    .login-container .links { text-align:center; margin-top:20px; }
    .login-container .links a {
      font-size:13px; text-decoration:none; margin:0 10px;
      color:#111; font-weight:500; text-shadow:0 0 1px rgba(0,0,0,0.4);
    }
    .login-container .links a:hover { text-decoration:underline; }
    .error-message {
      background-color:rgba(255,0,0,0.2); padding:10px; margin-bottom:15px;
      border-radius:8px; color:#ffaaaa; font-size:13px;
      display: {% if get_flashed_messages() %}block{% else %}none{% endif %};
    }
    .remember-checkbox { display:flex; align-items:center; gap:8px; font-size:14px; color:#ccc; margin-bottom:20px; user-select:none; }
    .remember-checkbox input[type="checkbox"] { width:16px; height:16px; accent-color:#00ffff; margin:0; cursor:pointer; }
    @media screen and (max-width:480px) {
      .login-container { padding:30px 20px; font-size:14px; }
      .login-container h2 { font-size:20px; }
      .login-container input, .login-container button { padding:10px; font-size:13px; }
    }
  </style>

</head>
<body>
  <form class="login-container" method="POST" action="/login">
    <h2><i class="fas fa-lock"></i> SAM.. </h2>


{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="error-message alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<input type="text" name="identifier" placeholder="Kullanıcı adı veya e-posta" required autofocus>
<input type="password" name="password" placeholder="Şifre" required>

<label class="remember-checkbox">
  <input type="checkbox" name="remember" id="remember">
  <span>Oturumumu hatırla</span>
</label>

<button type="submit">Giriş Yap</button>

<div class="links">
  <a href="/reset-password">Şifremi unuttum</a>
  <a href="/register">Kayıt Ol</a>
</div>

<div style="text-align:center; margin-top:30px; font-size:14px; color:#00ffff; font-weight:bold;">
  SAM {{ app_version }}
</div>


  </form>

  <script>
    // Flash mesajları otomatik gizleme
    const flashBoxes = document.querySelectorAll(".error-message");
    flashBoxes.forEach(box => {
      if(box.textContent.trim() !== ""){
        setTimeout(()=>{
          box.style.transition="opacity 0.5s ease";
          box.style.opacity=0;
          setTimeout(()=>box.remove(),500);
        },3000);
      }
    });
  </script>

</body>
</html>
